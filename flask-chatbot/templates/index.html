<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIES Nerul College Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="https://placehold.co/100x100/1e3a8a/white?text=SIES" alt="SIES Logo">
            SIES Nerul College Chatbot
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>
        <div class="quick-buttons">
            <button class="quick-button" onclick="sendQuickMessage('Admission Dates')">Admission Dates</button>
            <button class="quick-button" onclick="sendQuickMessage('Courses Offered')">Courses Offered</button>
            <button class="quick-button" onclick="sendQuickMessage('Contact Info')">Contact Info</button>
            <button class="quick-button" onclick="sendQuickMessage('NAAC & Autonomy')">NAAC & Autonomy</button>
            <button class="quick-button" onclick="sendQuickMessage('Campus Facilities')">Campus Facilities</button>
            <button class="quick-button" onclick="sendQuickMessage('College Overview')">College Overview</button>
        </div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Type your question here..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
